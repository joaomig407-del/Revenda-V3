 w2['!cols']=[26,10,12,14].map(w=>({wch:w}));Object.keys(w2).forEach(k=>{if(/^D\d+$/.test(k)&&w2[k].t=='n')w2[k].z='"R$" #,##0.00'});
 const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'Vendas');XLSX.utils.book_append_sheet(wb,w2,'Por vendedor');
 XLSX.writeFile(wb,'vendas_'+(xa||'inicio')+(xb&&xb!=xa?'_a_'+xb:'')+'.xlsx')}
async function autoSku(){if(!confirm('Gerar SKU automático para cada cor que estiver sem código?'))return;
 for(const p of P){const cs=p.colors.split(',').map(x=>x.trim()).filter(Boolean),vars=p.vars.map(v=>{const{sku,...r}=v,k={...(v.skus||{})};cs.forEach(c=>{if(!k[c])k[c]=skuOf(v,c)||slug(p.name+'-'+v.n+'-'+c)});return{...r,skus:k}});
  if(JSON.stringify(vars)!=JSON.stringify(p.vars)){const r=await sb.from('products').update({vars}).eq('id',p.id);if(err(r.error))return}}
 refresh();alert('SKUs gerados! Você pode editar cada um dentro do produto.')}
function waBtn(o){const t=(o.phone||'').replace(/\D/g,'');if(t.length<10)return '<span class="mu" style="font-size:12px">sem WhatsApp</span>';
 const n=t.length<=11?'55'+t:t,m=`Olá, ${o.who}! 🎉 Seu pedido #${o.id} está pronto: pode vir buscar! 📦 Total: ${R(o.total)}. Obrigado pela preferência!`;
 return `<a class="btn p" style="text-decoration:none;background:#25d366" href="https://wa.me/${n}?text=${encodeURIComponent(m)}" target="_blank" rel="noopener">📲 Avisar no WhatsApp</a>`}
function ordersV(adm){
 const l=O.filter(o=>(ost=='todos'||o.status==ost)&&(o.email||'').toLowerCase().includes(oemail.trim().toLowerCase())),cnt=s=>O.filter(o=>s=='todos'||o.status==s).length,stp=s=>({novo:1,producao:2,concluido:3}[s]||1);
 return `${adm?xlCard():''}<input id="fe" placeholder="🔍 Filtrar por e-mail..." value="${E(oemail)}" oninput="oemail=this.value;rl(this)">
<div class="tabs">${['todos','novo','producao','concluido'].map(s=>`<button class="tab ${ost==s?'on':''}" onclick="ost='${s}';go()">${s=='todos'?'Todos':ST[s]} (${cnt(s)})</button>`).join('')}</div>
${l.map(o=>`<div class="ord ${o.status}"><div class="row" style="border:0;padding:0"><div><b style="font-size:16px">${E(o.who)}</b> ${stTag(o.status)}<br><span class="mu" style="font-size:12px">✉️ ${E(o.email||'—')} · ${dt(o.created_at)} · #${o.id}</span></div><b class="price">${R(o.total)}</b></div>
<div class="steps">${[1,2,3].map(n=>`<i class="${n<=stp(o.status)?'on':''}"></i>`).join('')}</div>
<div class="mu" style="font-size:13px">${o.items.map(i=>`${i.q}x ${E(i.name)} ${E(i.v)} (${E(i.c)})`).join('<br>')}</div>
${noteBox(o)}<div style="margin-top:10px;display:flex;gap:8px;flex-wrap:wrap;align-items:center">${adm?`<select onchange="setSt(${o.id},this.value)" style="width:auto;margin:0">${Object.keys(ST).map(k=>`<option value="${k}" ${o.status==k?'selected':''}>${ST[k]}</option>`).join('')}</select><button class="btn s" onclick="oedit(${o.id})">✏️ Editar</button><button class="btn s d" onclick="odel(${o.id})">🗑 Excluir</button>`:`${o.status!='producao'?`<button class="btn" onclick="setSt(${o.id},'producao')">🔧 Em produção</button>`:''}${o.status!='concluido'?`<button class="btn p" onclick="setSt(${o.id},'concluido')">📦 Pode vir buscar</button>`:''}`}${o.status=='concluido'?waBtn(o):''}</div></div>`).join('')||'<div class="card mu" style="text-align:center">Nenhum pedido encontrado.</div>'}`}
function oedit(id){
 const o=O.find(x=>x.id==id),d={who:o.who,email:o.email||'',phone:o.phone||'',note:o.note||'',items:o.items.map(i=>({...i}))},m=document.createElement('div');m.className='modal';
 const flat=P.flatMap(p=>p.vars.map(v=>({id:p.id,name:p.name,v:v.n,p:v.p,sku:skuOf(v,(p.colors.split(',')[0]||'').trim()),c:(p.colors.split(',')[0]||'').trim()}))),tot=()=>d.items.reduce((a,i)=>a+i.p*i.q,0);
 const draw=()=>{m.innerHTML=`<div><h2>✏️ Editar pedido #${o.id}</h2><label>Nome do revendedor</label><input id="ow" value="${E(d.who)}"><label>E-mail</label><input id="oe" value="${E(d.email)}"><label>WhatsApp</label><input id="op" value="${E(d.phone)}"><label>📝 Observação</label><textarea id="ok" rows="3">${E(d.note)}</textarea>
${d.items.map((i,k)=>`<div class="ord" style="padding:10px"><b>${E(i.name)}</b> <span class="mu">${E(i.v)}</span> <button class="btn s d" data-r="${k}" style="float:right">✕</button><div style="display:grid;grid-template-columns:70px 1fr 95px;gap:8px;margin-top:8px"><div><label>Qtd</label><input type="number" min="1" value="${i.q}" data-f="q" data-k="${k}" style="margin:0"></div><div><label>Cor</label><input value="${E(i.c)}" data-f="c" data-k="${k}" style="margin:0"></div><div><label>Preço un.</label><input type="number" step="0.01" value="${i.p}" data-f="p" data-k="${k}" style="margin:0"></div></div></div>`).join('')}
<label>Adicionar item</label><div style="display:flex;gap:8px"><select id="oa" style="margin:0">${flat.map((x,k)=>`<option value="${k}">${E(x.name)} — ${E(x.v)} (${R(x.p)})</option>`).join('')}</select><button class="btn p" id="oaa">+</button></div>
<div class="row"><b>Total</b><span class="price" id="ot">${R(tot())}</span></div><button class="btn p" style="width:100%" id="os">Salvar alterações</button><button class="btn" style="width:100%;margin-top:8px" id="oc">Cancelar</button></div>`;
 m.querySelector('#ow').oninput=e=>d.who=e.target.value;m.querySelector('#oe').oninput=e=>d.email=e.target.value;m.querySelector('#op').oninput=e=>d.phone=e.target.value;m.querySelector('#ok').oninput=e=>d.note=e.target.value;
 m.querySelectorAll('[data-f]').forEach(inp=>inp.oninput=()=>{const f=inp.dataset.f,i=d.items[inp.dataset.k];i[f]=f=='c'?inp.value:f=='q'?Math.max(1,parseInt(inp.value)||1):Math.max(0,parseFloat(inp.value)||0);if(f=='c'){const pp=P.find(x=>x.id==i.id),vv=pp&&pp.vars.find(x=>x.n==i.v);if(vv)i.sku=skuOf(vv,i.c.trim())}m.querySelector('#ot').textContent=R(tot())});
 m.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{d.items.splice(b.dataset.r,1);draw()});
 m.querySelector('#oaa').onclick=()=>{const x=flat[m.querySelector('#oa').value];if(x){d.items.push({id:x.id,name:x.name,v:x.v,c:x.c,p:x.p,q:1,sku:x.sku});draw()}};
 m.querySelector('#oc').onclick=()=>m.remove();
 m.querySelector('#os').onclick=async()=>{if(!d.items.length)return alert('O pedido precisa ter ao menos 1 item');
  const r=await sb.from('orders').update({who:d.who.trim()||o.who,email:d.email.trim()||null,phone:d.phone.replace(/\D/g,'')||null,note:d.note.trim()||null,items:d.items,total:Number(tot().toFixed(2))}).eq('id',id);if(err(r.error))return;m.remove();refresh()}};
 draw();document.body.appendChild(m)}
async function setSt(id,st){if(err((await sb.rpc('set_order_status',{pedido_id:id,novo_status:st})).error))return;refresh()}
async function odel(id){if(confirm('Excluir este pedido?')){if(err((await sb.from('orders').delete().eq('id',id)).error))return;refresh()}}
async function urole(id,r){if(err((await sb.from('profiles').update({role:r,status:'active'}).eq('id',id)).error))return;refresh()}
function prodV(){return hdr('Produção')+`<div class="wrap"><div class="card g" style="color:#fff;margin-bottom:12px"><b style="font-size:18px">🏭 Área de Produção</b><br>Marque os pedidos como em produção ou pode vir buscar. <button class="btn s" onclick="refresh()">🔄 Atualizar</button></div>${ordersV(false)}</div>`}

function resV(){const cats=['Todos',...new Set(P.map(p=>p.cat))],list=P.filter(p=>(cat=='Todos'||p.cat==cat)&&p.name.toLowerCase().includes(q.toLowerCase()));
 const tot=cart.reduce((a,i)=>a+i.p*i.q,0),n=cart.reduce((a,i)=>a+i.q,0);
 return hdr('Preços de Revenda')+`<div class="wrap"><div class="card g" style="color:#fff;margin-bottom:12px"><b style="font-size:18px">Olá, ${E(me.name)} 👋</b><br>Escolha o produto, cor e quantidade. O total é calculado automaticamente.</div>${O.some(o=>o.status=='concluido')?`<div class="card" style="background:#16a34a;color:#fff;margin-bottom:12px"><b>🎉 ${O.filter(o=>o.status=='concluido').length} pedido(s) pronto(s): pode vir buscar!</b></div>`:''}
<input id="qs" placeholder="🔍 Buscar produto..." value="${E(q)}" oninput="q=this.value;rl(this)"><div class="tabs">${cats.map(c=>`<button class="tab ${cat==c?'on':''}" onclick="cat='${E(c)}';go()">${E(c)}</button>`).join('')}</div>
<div class="grid">${list.map(p=>{const cs=p.colors.split(',').map(s=>s.trim()).filter(Boolean);return`<div class="card"><div class="img" style="${p.img?`background-image:url(${E(p.img)})`:''}">${p.img?'':E(p.emo)}</div><b>${E(p.name)}</b>
<select id="v${p.id}" onchange="pp(${p.id})">${p.vars.map((v,i)=>`<option value="${i}">${E(v.n)} — ${R(v.p)}</option>`).join('')}</select>
<select id="c${p.id}">${cs.map(c=>`<option>${E(c)}</option>`).join('')||'<option>Único</option>'}</select>
<div class="row" style="border:0;padding:0"><input id="q${p.id}" type="number" min="1" value="1" style="width:70px;margin:0"><span class="price" id="pr${p.id}">${R(p.vars[0].p)}</span></div>
<button class="btn p" style="width:100%;margin-top:10px" onclick="add(${p.id})">Adicionar</button></div>`}).join('')||'<p class="mu">Nada encontrado.</p>'}</div>
${O.length?`<h2>Meus pedidos</h2>${O.map(o=>`<div class="ord ${o.status}"><div class="row" style="border:0;padding:0"><div>${stTag(o.status)}<br><span class="mu" style="font-size:12px">${dt(o.created_at)} · #${o.id}</span></div><b class="price">${R(o.total)}</b></div><div class="steps">${[1,2,3].map(n=>`<i class="${n<=({novo:1,producao:2,concluido:3}[o.status]||1)?'on':''}"></i>`).join('')}</div><div class="mu" style="font-size:13px">${o.items.map(i=>`${i.q}x ${E(i.name)} ${E(i.v)} (${E(i.c)})`).join('<br>')}</div>${noteBox(o)}</div>`).join('')}`:''}<div style="height:90px"></div></div>
${n?`<div class="cartbar"><button class="btn p" style="width:100%;padding:15px;font-size:16px" onclick="cartV()">🛒 ${n} itens · ${R(tot)} — Finalizar</button></div>`:''}`}
function rl(el){const s=el.selectionStart,id=el.id;go();const i=document.getElementById(id);i.focus();i.setSelectionRange(s,s)}

 const x=cart.find(i=>i.id==id&&i.v==v.n&&i.c==c);x?x.q+=k:cart.push({id,name:p.name,v:v.n,c,p:v.p,q:k,sku:skuOf(v,c)});go()}
function cartV(){let nt='';const m=document.createElement('div');m.className='modal';
 const draw=()=>{const t=cart.reduce((a,i)=>a+i.p*i.q,0);m.innerHTML=`<div><h2>🛒 Seu pedido</h2><label>Nome do revendedor</label><input id="rn" value="${E(me.name)}"><label>WhatsApp (avisamos quando estiver pronto)</label><input id="rt" type="tel" value="${E(me.phone||(()=>{try{return localStorage.getItem('rvphone')||''}catch(e){return ''}})())}">
${cart.map((i,k)=>`<div class="row"><div><b>${E(i.name)}</b><br><span class="mu">${E(i.v)} · ${E(i.c)} · ${R(i.p)}</span></div><div>${i.q}x <b>${R(i.p*i.q)}</b> <button class="btn s d" data-k="${k}">✕</button></div></div>`).join('')}
<label style="display:block;margin-top:10px">📝 Observação (opcional)</label><textarea id="rk" rows="3" placeholder="Ex.: bordar o nome do pet, cor especial, prazo..."></textarea>
<div class="row"><b>Total</b><span class="price">${R(t)}</span></div><button class="btn p" style="width:100%" id="sd">Enviar pedido</button><button class="btn" style="width:100%;margin-top:8px" id="cl">Fechar</button></div>`;
 m.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{cart.splice(b.dataset.k,1);if(!cart.length){m.remove()}else draw();go()});

 draw();document.body.appendChild(m)}
setInterval(()=>{if(me&&me.role!='rev'&&!document.querySelector('.modal')&&!['INPUT','SELECT','TEXTAREA'].includes(document.activeElement.tagName))refresh()},30000);
