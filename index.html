<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Painel de Revendas</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#1a1d23;--mut:#6b7280;--pri:#2563eb;--bd:#e3e6ea;--err:#dc2626;--ok:#16a34a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1115;--card:#181b21;--tx:#eef0f3;--mut:#9aa1ad;--pri:#5b8cff;--bd:#2a2e36;--err:#f87171;--ok:#4ade80}}
:root[data-theme="dark"]{--bg:#0f1115;--card:#181b21;--tx:#eef0f3;--mut:#9aa1ad;--pri:#5b8cff;--bd:#2a2e36;--err:#f87171;--ok:#4ade80}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.45}
.wrap{max-width:520px;margin:0 auto;padding:20px 16px 40px}
.wrap.wide{max-width:860px}
h1{font-size:22px;margin:8px 0 4px}h2{font-size:17px;margin:0 0 12px}
p.s{color:var(--mut);margin:0 0 16px;font-size:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;margin-bottom:16px}
label{display:block;font-size:13px;color:var(--mut);margin:10px 0 4px}
input,textarea{width:100%;padding:11px 12px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font:inherit}
button{font:inherit;border:0;border-radius:10px;padding:11px 16px;background:var(--pri);color:#fff;cursor:pointer;width:100%;margin-top:14px}
button.g{background:transparent;color:var(--pri);border:1px solid var(--bd);width:auto;margin:0;padding:6px 12px;font-size:13px}
.tabs{display:flex;gap:8px;margin-bottom:12px}.tabs button{margin:0;background:var(--card);color:var(--tx);border:1px solid var(--bd)}
.tabs button.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.msg{color:var(--err);font-size:13px;margin-top:10px;min-height:16px}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.item{border-top:1px solid var(--bd);padding:12px 0;display:flex;justify-content:space-between;gap:10px}
.item:first-child{border-top:0}.item b{display:block}.item small{color:var(--mut)}
.empty{color:var(--mut);font-size:14px;text-align:center;padding:12px}
.note{font-size:12px;color:var(--mut);text-align:center;margin-top:20px}
.bd{font-size:11px;background:var(--pri);color:#fff;border-radius:6px;padding:2px 7px;margin-left:6px;vertical-align:middle}
select{width:100%;padding:10px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font:inherit}.item select{width:auto;font-size:13px;padding:6px}
.sum{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:16px}.sum div{flex:1;min-width:130px;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;font-size:12px;color:var(--mut)}.sum b{display:block;font-size:18px;color:var(--tx)}
.fb{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:16px 0}
.fb .chip{width:auto;margin:0;padding:7px 13px;font-size:13px;background:var(--card);color:var(--tx);border:1px solid var(--bd)}
.fb .chip.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.fb input{width:auto;padding:6px 10px;font-size:13px}.fb input.on{border-color:var(--pri)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:16px}.g2 .card{margin-bottom:0}.g2{margin-bottom:16px}
@media (max-width:640px){.g2{grid-template-columns:1fr}}
.star{font-size:12px;color:var(--mut)}.star strong{display:block;font-size:20px;color:var(--tx);margin:2px 0}.star span{color:var(--ok);font-weight:600}
.hb{margin:10px 0}.hb .l{display:flex;justify-content:space-between;gap:8px;font-size:13px}.hb .l span:last-child{color:var(--mut);white-space:nowrap}
.hb .t{height:8px;border-radius:5px;background:var(--bd);margin-top:4px;overflow:hidden}.hb .t i{display:block;height:100%;background:var(--pri)}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
var KU='rv_users',KS='rv_session',KR='rv_resellers',KO='rv_orders';
function load(k,d){try{var v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}}
function save(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){return false}}
var mem={users:load(KU,[]),session:load(KS,null),res:load(KR,[]),ord:load(KO,[])};
var mode='login',err='',ST=['Novo','Em andamento','Concluído','Cancelado'];
async function hash(s){var b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return Array.from(new Uint8Array(b)).map(function(x){return x.toString(16).padStart(2,'0')}).join('')}
function esc(s){var d=document.createElement('div');d.textContent=s==null?'':s;return d.innerHTML}
function $(id){return document.getElementById(id)}
function brl(n){return Number(n||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'})}
function stSel(o){return '<select data-st="'+o.id+'">'+ST.map(function(x){return '<option'+(x===o.status?' selected':'')+'>'+x+'</option>'}).join('')+'</select>'}

/* ---------- Datas e filtro ---------- */
function pad(n){return n<10?'0'+n:''+n}
function dk(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
/* pedidos antigos não tinham data/hora exata: reconstrói a partir do id (timestamp) ou da data pt-BR */
(function(){var ch=false;mem.ord.forEach(function(o){if(o.ts)return;var d=new Date(+o.id);if(isNaN(d)){var m=/^(\d{1,2})\/(\d{1,2})\/(\d{4})/.exec(o.date||'');d=m?new Date(+m[3],+m[2]-1,+m[1],12):new Date()}o.ts=d.toISOString();ch=true});if(ch)save(KO,mem.ord)})();
var flt={m:'todos',day:dk(new Date())};
function defFlt(){flt.m=mem.session&&mem.session.role==='owner'?'mes':'todos';flt.day=dk(new Date())}
function rng(){var t=new Date(),k=dk(t);
  if(flt.m==='hoje')return[k,k];
  if(flt.m==='ontem'){var y=new Date(t);y.setDate(t.getDate()-1);return[dk(y),dk(y)]}
  if(flt.m==='7d'){var s=new Date(t);s.setDate(t.getDate()-6);return[dk(s),k]}
  if(flt.m==='mes')return[k.slice(0,8)+'01',k];
  if(flt.m==='dia')return[flt.day,flt.day];
  return null}
function inR(o,r){if(!r)return true;var k=dk(new Date(o.ts));return k>=r[0]&&k<=r[1]}
function fbar(){var L=[['hoje','Hoje'],['ontem','Ontem'],['7d','7 dias'],['mes','Este mês'],['todos','Tudo']];
  return '<div class="fb">'+L.map(function(c){return '<button class="chip'+(flt.m===c[0]?' on':'')+'" data-f="'+c[0]+'">'+c[1]+'</button>'}).join('')+'<input type="date" id="fd" value="'+flt.day+'" class="'+(flt.m==='dia'?'on':'')+'" aria-label="Escolher um dia"></div>'}
function wireFilter(a){
  Array.prototype.forEach.call(a.querySelectorAll('[data-f]'),function(b){b.onclick=function(){flt.m=b.getAttribute('data-f');render()}});
  var fd=$('fd');if(fd)fd.onchange=function(){if(fd.value){flt.day=fd.value;flt.m='dia';render()}};
}

/* ---------- Cálculos do painel ---------- */
function sold(l){return l.filter(function(o){return o.status!=='Cancelado'})}
function sum(l){return l.reduce(function(t,o){return t+o.total},0)}
function groupBy(l,kf,lf,vf){var m={};l.forEach(function(o){var k=kf(o);if(!m[k])m[k]={label:lf(o),v:0,n:0};m[k].v+=vf(o);m[k].n++});return Object.keys(m).map(function(k){return m[k]}).sort(function(a,b){return b.v-a.v})}
function bySeller(l){return groupBy(l,function(o){return o.owner},function(o){return o.ownerName||o.owner},function(o){return o.total})}
function hbars(items,fmt,max){items=items.slice(0,max||5);if(!items.length)return '<div class="empty">Sem dados neste período.</div>';
  var mx=items[0].v||1;return items.map(function(i){return '<div class="hb"><div class="l"><span>'+esc(i.label)+'</span><span>'+fmt(i)+'</span></div><div class="t"><i style="width:'+Math.max(3,i.v/mx*100)+'%"></i></div></div>'}).join('')}
function star(title,l){var s=bySeller(l);
  if(!s.length)return '<div class="card star">'+title+'<strong>—</strong>Nenhuma venda ainda.</div>';
  return '<div class="card star">'+title+'<strong>'+esc(s[0].label)+'</strong><span>'+brl(s[0].v)+'</span> · '+s[0].n+' pedido'+(s[0].n>1?'s':'')+hbars(s.slice(1),function(i){return brl(i.v)},4)+'</div>'}
function series(l,r){var lb=[],vs=[],i;
  if(r&&r[0]===r[1]){for(i=0;i<24;i++){lb.push(i+'h');vs.push(0)}l.forEach(function(o){vs[new Date(o.ts).getHours()]+=o.total});return{lb:lb,vs:vs}}
  var a,b;
  if(r){a=r[0];b=r[1]}else{if(!l.length)return{lb:lb,vs:vs};var ks=l.map(function(o){return dk(new Date(o.ts))}).sort();a=ks[0];b=dk(new Date())}
  var d=new Date(+b.slice(0,4),+b.slice(5,7)-1,+b.slice(8,10)),days=[];
  while(dk(d)>=a&&days.length<31){days.unshift(dk(d));d.setDate(d.getDate()-1)}
  var idx={};days.forEach(function(k,j){idx[k]=j;lb.push(k.slice(8)+'/'+k.slice(5,7));vs.push(0)});
  l.forEach(function(o){var k=dk(new Date(o.ts));if(idx[k]!=null)vs[idx[k]]+=o.total});return{lb:lb,vs:vs}}
function vchart(lb,vs){if(!vs.length)return '<div class="empty">Sem dados neste período.</div>';
  var W=600,H=190,pb=24,pt=18,n=vs.length,mx=Math.max.apply(null,vs.concat([1])),bw=W/n,g=Math.min(6,bw*.2),step=Math.ceil(n/12);
  var s='<svg viewBox="0 0 '+W+' '+H+'" width="100%" role="img" aria-label="Vendas por período">';
  vs.forEach(function(v,i){var h=(H-pb-pt)*v/mx,x=i*bw+g/2,y=H-pb-h,cx=x+(bw-g)/2;
    s+='<rect x="'+x+'" y="'+y+'" width="'+(bw-g)+'" height="'+(v>0?Math.max(h,2):0)+'" rx="3" style="fill:var(--pri)"><title>'+esc(lb[i])+': '+brl(v)+'</title></rect>';
    if(n<=14&&v>0)s+='<text x="'+cx+'" y="'+(y-4)+'" text-anchor="middle" font-size="10" style="fill:var(--mut)">'+Math.round(v)+'</text>';
    if(i%step===0)s+='<text x="'+cx+'" y="'+(H-8)+'" text-anchor="middle" font-size="10" style="fill:var(--mut)">'+esc(lb[i])+'</text>'});
  return s+'<line x1="0" x2="'+W+'" y1="'+(H-pb)+'" y2="'+(H-pb)+'" style="stroke:var(--bd)"/></svg>'}
function ownerView(){
  var r=rng(),f=mem.ord.filter(function(o){return inR(o,r)}),fs=sold(f),all=sold(mem.ord),td=dk(new Date());
  var tot=sum(fs),n=fs.length,sr=series(fs,r);
  var hoje=all.filter(function(o){return dk(new Date(o.ts))===td}),mes=all.filter(function(o){return dk(new Date(o.ts)).slice(0,7)===td.slice(0,7)});
  var prods=groupBy(fs,function(o){return (o.product||'').trim().toLowerCase()},function(o){return o.product},function(o){return o.qty});
  var revs=groupBy(fs,function(o){return o.resName},function(o){return o.resName},function(o){return o.total});
  var sts=ST.map(function(s){return{label:s,v:f.filter(function(o){return o.status===s}).length}}).filter(function(x){return x.v}).sort(function(a,b){return b.v-a.v});
  return '<div class="g2">'+star('Quem mais vendeu hoje',hoje)+star('Quem mais vendeu no mês',mes)+'</div>'+
  '<h2 style="margin-top:8px">Detalhes do período</h2>'+fbar()+
  '<div class="sum"><div><b>'+brl(tot)+'</b>Faturamento</div><div><b>'+n+'</b>Pedidos válidos</div><div><b>'+brl(n?tot/n:0)+'</b>Ticket médio</div><div><b>'+(f.length-n)+'</b>Cancelados</div></div>'+
  '<div class="card"><h2>'+(r&&r[0]===r[1]?'Vendas por hora':'Vendas por dia')+'</h2>'+vchart(sr.lb,sr.vs)+'</div>'+
  '<div class="g2"><div class="card"><h2>Ranking de vendedores</h2>'+hbars(bySeller(fs),function(i){return brl(i.v)},8)+'</div>'+
  '<div class="card"><h2>Produtos mais vendidos</h2>'+hbars(prods,function(i){return i.v+' un.'},8)+'</div></div>'+
  '<div class="g2"><div class="card"><h2>Revendas que mais compraram</h2>'+hbars(revs,function(i){return brl(i.v)},6)+'</div>'+
  '<div class="card"><h2>Pedidos por status</h2>'+hbars(sts,function(i){return i.v+' pedido'+(i.v>1?'s':'')},4)+'</div></div>'}

/* ---------- Telas ---------- */
function render(){
  var a=$('app');
  if(!mem.session){
    a.className='wrap';
    a.innerHTML='<h1>Painel de Revendas</h1><p class="s">Crie sua conta para cadastrar revendas e fazer pedidos.</p>'+
    '<div class="tabs"><button id="t1" class="'+(mode==='login'?'on':'')+'">Entrar</button><button id="t2" class="'+(mode==='reg'?'on':'')+'">Criar conta</button></div>'+
    '<div class="card">'+(mode==='reg'?'<label>Nome</label><input id="nm" autocomplete="name">':'')+
    '<label>'+(mode==='reg'?'E-mail':'Usuário ou e-mail')+'</label><input id="em" type="text" autocapitalize="none" autocomplete="username">'+
    '<label>Senha</label><input id="pw" type="password" autocomplete="'+(mode==='reg'?'new-password':'current-password')+'">'+
    '<div class="msg">'+esc(err)+'</div><button id="go">'+(mode==='reg'?'Criar conta':'Entrar')+'</button></div>'+
    '<p class="note">Protótipo: os dados ficam salvos apenas neste navegador.</p>';
    $('t1').onclick=function(){mode='login';err='';render()};
    $('t2').onclick=function(){mode='reg';err='';render()};
    $('go').onclick=auth;return;
  }
  var u=mem.session,adm=u.role==='admin',own=u.role==='owner';
  a.className='wrap'+(adm||own?' wide':'');
  var top='<div class="top"><div><h1>Olá, '+esc(u.name)+(adm?'<span class="bd">Admin</span>':'')+(own?'<span class="bd">Dono</span>':'')+'</h1><p class="s" style="margin:0">'+esc(u.email)+'</p></div><button class="g" id="out">Sair</button></div>';
  if(own){
    a.innerHTML=top+'<div style="margin-top:16px">'+ownerView()+'</div>';
    wireFilter(a);
  }else if(adm){
    var f=mem.ord.filter(function(o){return inR(o,rng())}),tot=sum(sold(f));
    a.innerHTML=top+fbar()+'<div class="sum"><div><b>'+f.length+'</b>Pedidos</div><div><b>'+brl(tot)+'</b>Total (sem cancelados)</div><div><b>'+mem.users.length+'</b>Usuários</div></div>'+
    '<div class="card"><h2>Pedidos</h2>'+(f.length?f.map(function(o){var d=new Date(o.ts);return '<div class="item"><div><b>#'+o.id.slice(-5)+' · '+esc(o.product)+' ×'+o.qty+'</b><small>'+esc(o.resName)+' · por '+esc(o.ownerName)+'</small><small>'+brl(o.total)+' · '+d.toLocaleDateString('pt-BR')+' '+d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})+'</small></div>'+stSel(o)+'</div>'}).join(''):'<div class="empty">Nenhum pedido neste período.</div>')+'</div>';
    wireFilter(a);
  }else{
    var mr=mem.res.filter(function(r){return r.owner===u.email}),mo=mem.ord.filter(function(o){return o.owner===u.email});
    a.innerHTML=top+
    '<div class="card" style="margin-top:16px"><h2>Cadastrar revenda</h2><label>Nome da revenda</label><input id="rn"><label>Cidade / Estado</label><input id="rc"><label>Telefone / WhatsApp</label><input id="rt" type="tel"><div class="msg">'+esc(err&&err.r||'')+'</div><button id="add">Salvar revenda</button></div>'+
    '<div class="card"><h2>Minhas revendas ('+mr.length+')</h2>'+(mr.length?mr.map(function(r){return '<div class="item"><div><b>'+esc(r.name)+'</b><small>'+esc(r.city)+(r.phone?' · '+esc(r.phone):'')+'</small></div><button class="g" data-id="'+r.id+'">Excluir</button></div>'}).join(''):'<div class="empty">Nenhuma revenda ainda.</div>')+'</div>'+
    '<div class="card"><h2>Novo pedido</h2>'+(mr.length?'<label>Revenda</label><select id="or">'+mr.map(function(r){return '<option value="'+r.id+'">'+esc(r.name)+'</option>'}).join('')+'</select><label>Produto</label><input id="op"><label>Quantidade</label><input id="oq" type="number" min="1" value="1"><label>Valor unitário (R$)</label><input id="ov" type="number" min="0" step="0.01"><div class="msg">'+esc(err&&err.o||'')+'</div><button id="ao">Enviar pedido</button>':'<div class="empty">Cadastre uma revenda para fazer pedidos.</div>')+'</div>'+
    '<div class="card"><h2>Meus pedidos ('+mo.length+')</h2>'+(mo.length?mo.map(function(o){return '<div class="item"><div><b>'+esc(o.product)+' ×'+o.qty+'</b><small>'+esc(o.resName)+' · '+brl(o.total)+'</small></div><small>'+esc(o.status)+'</small></div>'}).join(''):'<div class="empty">Nenhum pedido ainda.</div>')+'</div>';
    $('add').onclick=addRes;if($('ao'))$('ao').onclick=addOrd;
    Array.prototype.forEach.call(a.querySelectorAll('[data-id]'),function(b){b.onclick=function(){mem.res=mem.res.filter(function(r){return r.id!==b.getAttribute('data-id')});save(KR,mem.res);render()}});
  }
  $('out').onclick=function(){mem.session=null;save(KS,null);err='';render()};
  Array.prototype.forEach.call(a.querySelectorAll('[data-st]'),function(sl){sl.onchange=function(){var o=mem.ord.filter(function(x){return x.id===sl.getAttribute('data-st')})[0];o.status=sl.value;save(KO,mem.ord);render()}});
}
async function auth(){
  var em=$('em').value.trim().toLowerCase(),pw=$('pw').value,nm=mode==='reg'?$('nm').value.trim():'';
  if(em!=='admin'&&em!=='dono'&&!/^\S+@\S+\.\S+$/.test(em)){err='E-mail inválido.';return render()}
  if(mode==='reg'&&pw.length<6){err='A senha precisa ter ao menos 6 caracteres.';return render()}
  var h=await hash(pw+em);
  if(mode==='reg'){
    if(!nm){err='Informe seu nome.';return render()}
    if(em==='admin'||em==='dono'||mem.users.some(function(u){return u.email===em})){err='Este e-mail já tem conta.';return render()}
    var role='user';
    mem.users.push({name:nm,email:em,h:h,role:role});save(KU,mem.users);
    mem.session={name:nm,email:em,role:role};
  }else{
    var u=mem.users.filter(function(x){return x.email===em&&x.h===h})[0];
    if(!u){err='E-mail ou senha incorretos.';return render()}
    mem.session={name:u.name,email:em,role:u.role||'user'};
  }
  save(KS,mem.session);err='';defFlt();render();
}
function addRes(){
  var n=$('rn').value.trim(),c=$('rc').value.trim();
  if(!n||!c){err={r:'Preencha nome e cidade.'};return render()}
  mem.res.unshift({id:String(Date.now()),owner:mem.session.email,name:n,city:c,phone:$('rt').value.trim()});
  save(KR,mem.res);err='';render();
}
function addOrd(){
  var p=$('op').value.trim(),q=parseInt($('oq').value,10),v=parseFloat($('ov').value),r=mem.res.filter(function(x){return x.id===$('or').value})[0];
  if(!p||!(q>0)||!(v>=0)){err={o:'Preencha produto, quantidade e valor.'};return render()}
  var now=new Date();
  mem.ord.unshift({id:String(now.getTime()),ts:now.toISOString(),owner:mem.session.email,ownerName:mem.session.name,resName:r.name,product:p,qty:q,total:q*v,status:'Novo',date:now.toLocaleDateString('pt-BR')});
  save(KO,mem.ord);err='';render();
}
(async function(){
  var ch=false;
  if(!mem.users.some(function(u){return u.email==='admin'})){mem.users.unshift({name:'Administrador',email:'admin',h:await hash('adminadmin'),role:'admin'});ch=true}
  /* conta do dono: usuário "dono", senha "dono1234" (troque depois) */
  if(!mem.users.some(function(u){return u.email==='dono'})){mem.users.push({name:'Dono da Empresa',email:'dono',h:await hash('dono1234dono'),role:'owner'});ch=true}
  if(ch)save(KU,mem.users);
  defFlt();render();
})();
</script>
</body>
</html>
