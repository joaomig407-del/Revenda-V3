function sepRows(list,ord){
  const rows=[];
  list.forEach(o=>o.items.forEach(i=>{
    const p=P.find(x=>x.id==i.id),v=p?.vars?.find(x=>x.n==i.v);
    const sku=i.sku||skuOf(v,i.c)||'';
    rows.push({pedido:o.id,cliente:o.who||'—',sku:sku||i.name||'—',produto:i.name||'—',opcao:i.v||'',cor:i.c||'',q:Number(i.q)||0,obs:o.note||''});
  }));
  if(ord==='sku'){
    const map={};
    rows.forEach(x=>{
      const k=(x.sku||x.produto)+'|'+x.cor+'|'+x.opcao;
      const r=map[k]||(map[k]={...x,pedidos:[],q:0,clientes:[]});
      r.q+=x.q;
      if(!r.pedidos.includes(x.pedido))r.pedidos.push(x.pedido);
      if(x.cliente&&!r.clientes.includes(x.cliente))r.clientes.push(x.cliente);
    });
    return Object.values(map).sort((a,b)=>String(a.sku).localeCompare(String(b.sku),'pt-BR'));
  }
  return rows;
}
async function gerarSeparacaoPDF({a,b,logo,empresa,ord='pedido'}){
  const list=inR('ped');
  if(!list.length)return alert('Nenhum pedido encontrado no período selecionado.');
  if(!window.jspdf?.jsPDF)return alert('A biblioteca do PDF não carregou. Verifique a internet e recarregue a página.');
  const {jsPDF}=window.jspdf,doc=new jsPDF({orientation:'portrait',unit:'mm',format:'a4'});
  const rows=sepRows(list,ord),pageW=210,margin=12;
  let y=12;
  const imgH=18;
  if(logo){
    try{doc.addImage(logo,'PNG',margin,y,42,imgH); }catch(e){try{doc.addImage(logo,'JPEG',margin,y,42,imgH)}catch(_){ }}
  }
  doc.setFont('helvetica','bold');doc.setFontSize(16);
  doc.text(empresa||'LISTA DE SEPARAÇÃO',logo?62:margin,y+7);
  doc.setFont('helvetica','normal');doc.setFontSize(9);
  doc.text('LISTA DE SEPARAÇÃO DE REVENDA',logo?62:margin,y+13);
  y+=24;
  doc.setDrawColor(220,220,230);doc.line(margin,y,pageW-margin,y);y+=6;
  doc.setFontSize(9);
  doc.text(`Período: ${a?dt(a+'T12:00:00'):'Início'} até ${b?dt(b+'T12:00:00'):'Hoje'}`,margin,y);
  doc.text(`Gerado em: ${dt(new Date())}`,pageW-margin,y,{align:'right'});y+=6;
  doc.setFont('helvetica','bold');doc.text(`Pedidos: ${list.length}  |  Itens: ${rows.reduce((s,r)=>s+(r.q||0),0)}`,margin,y);y+=7;

  const cols=ord==='sku'
    ? [{t:'✓',w:9},{t:'SKU',w:31},{t:'PRODUTO',w:63},{t:'COR / OPÇÃO',w:36},{t:'QTD.',w:16},{t:'PEDIDOS',w:26}]
    : [{t:'✓',w:9},{t:'SKU',w:28},{t:'PRODUTO',w:48},{t:'CLIENTE',w:40},{t:'COR / OPÇÃO',w:38},{t:'QTD.',w:15}];
  const drawHeader=()=>{
    doc.setFillColor(124,92,255);doc.setTextColor(255,255,255);doc.setFont('helvetica','bold');doc.setFontSize(8);
    let x=margin;cols.forEach(c=>{doc.rect(x,y,c.w,8,'F');doc.text(c.t,x+2,y+5);x+=c.w});y+=8;doc.setTextColor(25,27,42);
  };
  const wrap=(s,w)=>doc.splitTextToSize(String(s||'—'),w-4);
  drawHeader();
  doc.setFont('helvetica','normal');doc.setFontSize(7.5);
  rows.forEach((r,idx)=>{
    const vals=ord==='sku'
      ? ['☐',r.sku||r.produto,r.produto,[r.cor,r.opcao].filter(Boolean).join(' / ')||'—',r.q,(r.pedidos||[]).join(', ')]
      : ['☐',r.sku||r.produto,r.produto,r.cliente,[r.cor,r.opcao].filter(Boolean).join(' / ')||'—',r.q];
    const lines=vals.map((v,i)=>wrap(v,cols[i].w)),h=Math.max(9,...lines.map(x=>x.length*3.4+2));
    if(y+h>282){doc.addPage();y=12;drawHeader();doc.setFont('helvetica','normal');doc.setFontSize(7.5);}
    if(idx%2===0){doc.setFillColor(247,247,252);doc.rect(margin,y,pageW-2*margin,h,'F');}
    let x=margin;cols.forEach((c,i)=>{
      doc.setTextColor(25,27,42);doc.text(lines[i],x+2,y+5,{maxWidth:c.w-4});x+=c.w;
    });
    doc.setDrawColor(225,225,235);doc.line(margin,y+h,pageW-margin,y+h);y+=h;
  });
  y=Math.min(y+8,282);
  doc.setFont('helvetica','bold');doc.setFontSize(8);doc.text('Conferência: ____________________________________________',margin,y);
  const pages=doc.getNumberOfPages();
  for(let p=1;p<=pages;p++){doc.setPage(p);doc.setFont('helvetica','normal');doc.setFontSize(7);doc.setTextColor(110,112,133);doc.text(`Página ${p} de ${pages}`,pageW-margin,289,{align:'right'});}
  const nome='lista_separacao_'+(a||'inicio')+(b&&b!==a?'_a_'+b:'')+'.pdf';
  doc.save(nome);
}

 const draw=()=>{const t=cart.reduce((a,i)=>a+i.p*i.q,0);m.innerHTML=`<div><h2>🛒 Seu pedido</h2><label>Nome do revendedor</label><input id="rn" value="${E(me.name)}"><label>WhatsApp (avisamos quando estiver pronto)</label><input id="rt" type="tel" value="${E(me.phone||(()=>{try{return localStorage.getItem('rvphone')||''}catch(e){return ''}})())}">
${cart.map((i,k)=>`<div class="row"><div><b>${E(i.name)}</b><br><span class="mu">${E(i.v)} · ${E(i.c)} · ${R(i.p)}</span></div><div>${i.q}x <b>${R(i.p*i.q)}</b> <button class="btn s d" data-k="${k}">✕</button></div></div>`).join('')}
<label style="display:block;margin-top:10px">🕒 Em qual parte do dia você vai buscar?</label><div class="tabs" style="margin:4px 0 0">${Object.keys(PKL).map(k=>`<button class="tab ${pk==k?'on':''}" data-pk="${k}">${PKL[k]}</button>`).join('')}</div>
<label style="display:block;margin-top:10px">📝 Observação (opcional)</label><textarea id="rk" rows="3" placeholder="Ex.: bordar o nome do pet, cor especial, prazo..."></textarea>
<div class="row"><b>Total</b><span class="price">${R(t)}</span></div><button class="btn p" style="width:100%" id="sd">Enviar pedido</button><button class="btn" style="width:100%;margin-top:8px" id="cl">Fechar</button></div>`;
 m.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{cart.splice(b.dataset.k,1);if(!cart.length){m.remove()}else draw();go()});
 m.querySelector('#cl').onclick=()=>m.remove();
 m.querySelectorAll('[data-pk]').forEach(b=>b.onclick=()=>{pk=b.dataset.pk;m.querySelectorAll('[data-pk]').forEach(x=>x.classList.toggle('on',x.dataset.pk==pk))});m.querySelector('#rk').value=nt;m.querySelector('#rk').oninput=e=>nt=e.target.value;m.querySelector('#sd').onclick=async()=>{const ph=$('#rt').value.replace(/\D/g,'');if(ph.length<10)return alert('Informe o WhatsApp com DDD para avisarmos quando estiver pronto');try{localStorage.setItem('rvphone',ph)}catch(e){}const r=await sb.from('orders').insert({user_id:me.id,email:me.email,phone:ph,pickup:pk,note:nt.trim()||null,who:$('#rn').value.trim()||me.name,items:cart,total:t});if(err(r.error))return;cart=[];m.remove();alert('Pedido enviado ao admin! ✅');refresh()}};
 draw();document.body.appendChild(m)}
setInterval(()=>{if(me&&me.role!='rev'&&!$('#msgs')&&!document.querySelector('.modal')&&!['INPUT','SELECT','TEXTAREA'].includes(document.activeElement.tagName))refresh()},30000);
setInterval(async()=>{if(me&&(me.role=='admin'||me.role=='rev')&&$('#msgs')){await loadMsgs();drawMsgs();markRead(curConv())}},8000);
let idle;const rst=()=>{clearTimeout(idle);if(me)idle=setTimeout(()=>{alert('Sessão encerrada por inatividade.');out()},30*60000)};
['click','keydown','touchstart','mousemove'].forEach(e=>addEventListener(e,rst,{passive:true}));
boot();
</script></body></html>
