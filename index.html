<style>

.ord{margin:10px 0;padding:14px;border:1px solid var(--bd);border-left:5px solid #0ea5e9;border-radius:16px;background:var(--card)}.ord.producao{border-left-color:#f59e0b}.ord.concluido{border-left-color:var(--ok)}
.login{min-height:100vh;display:grid;place-items:center;padding:16px;background:linear-gradient(135deg,#7c5cff,#ff6bb5)}.login .card{width:min(100%,390px)}

.site-notice{position:relative;margin:0 0 18px;padding:clamp(22px,5vw,42px);border:4px solid #6656e8;border-radius:24px;background:linear-gradient(135deg,#f0edff,#fff);box-shadow:0 12px 35px #6656e844;text-align:center}
.site-notice.warning{border-color:#e99a00;background:linear-gradient(135deg,#fff4d6,#fff)}

.product{display:flex;flex-direction:column;gap:8px}.product h3{margin:0}.modal{position:fixed;inset:0;z-index:20;background:#0009;display:grid;place-items:end center}.modal>div{width:100%;max-width:540px;max-height:92vh;overflow:auto;background:var(--card);border-radius:22px 22px 0 0;padding:18px}

<script>
const SUPABASE_URL='https://rngylwfuhgmclexvfqiy.supabase.co';
const SUPABASE_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJuZ3lsd2Z1aGdtY2xleHZmcWl5IiwiaWF0IjoxNzkwNjM1MDE1LCJleHAiOjIxMDYyMTEwMTl9.LbYlRCXCvPQOtwiid27ZNDs8eXVKSWvv8OOR1oBMPPk';
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const $=s=>document.querySelector(s),E=s=>String(s??'').replace(/[&<>"']/g,c=>'&#'+c.charCodeAt(0)+';');
const NOTICE_PREFIX='__SITE_NOTICE_V1__:',ORDER_LABEL_TAG='__ORDER_LABELS__';
let me=null,P=[],U=[],O=[],MSG=[],META={},cart=[],tab='dash',notice={active:false,maintenance:false,type:'info',title:'',text:''},chatUser=null;
let filterFrom='',filterTo='';
const R=n=>'R$ '+Number(n||0).toFixed(2).replace('.',',');
const err=e=>{if(e){alert(e.message||e);return true}};
const dateKey=s=>{const d=new Date(s);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const prettyDate=s=>new Date(s).toLocaleDateString('pt-BR');
function noticeTag(n){return NOTICE_PREFIX+encodeURIComponent(JSON.stringify(n))}
function noticeFromTags(tags){const t=(tags||[]).find(x=>String(x).startsWith(NOTICE_PREFIX));if(!t)return null;try{return JSON.parse(decodeURIComponent(t.slice(NOTICE_PREFIX.length)))}catch(e){return null}}
function visibleTags(id){return(META[id]?.tags||[]).filter(t=>t!==ORDER_LABEL_TAG&&!String(t).startsWith(NOTICE_PREFIX))}
function go(){if(!me){$('#app').innerHTML=loginView();return}$('#app').innerHTML=me.role==='admin'?adminView():me.role==='prod'?workerView():me.role==='owner'?ownerView():sellerView()}
async function boot(){const{data:{session}}=await sb.auth.getSession();if(session)await enter(session.user.id);else go()}
async function enter(id){const{data,error}=await sb.from('profiles').select('*').eq('id',id).single();if(error||!data||data.status!=='active'){alert(data?.status==='pending'?'Cadastro aguardando aprovação do administrador.':'Acesso não autorizado.');await sb.auth.signOut();me=null;return go()}me=data;await load();go()}
async function load(){
 let r=await sb.from('products').select('*').order('id');if(r.error)console.error(r.error);P=r.data||[];
 r=await sb.from('orders').select('*').order('id',{ascending:false});if(r.error)console.error(r.error);O=r.data||[];
 if(me.role==='admin'){
  r=await sb.from('profiles').select('*').in('role',['rev','prod','owner']).order('name');U=r.data||[];
  r=await sb.from('rev_meta').select('*');META={};(r.data||[]).forEach(x=>META[x.rev_id]={tags:x.tags||[],note:x.note||''});
  const found=U.map(u=>noticeFromTags(META[u.id]?.tags)).find(Boolean);notice=found||{active:false,maintenance:false,type:'info',title:'',text:''};
 }else if(me.role==='rev'){
  r=await sb.from('rev_meta').select('tags').eq('rev_id',me.id).maybeSingle();notice=noticeFromTags(r.data?.tags)||{active:false,maintenance:false,type:'info',title:'',text:''};
 }
 await loadMessages();
}
async function loadMessages(){if(me.role==='prod'||me.role==='owner'){MSG=[];return}const{data,error}=await sb.from('messages').select('*').order('id',{ascending:false}).limit(500);if(error){MSG=[];return}MSG=(data||[]).filter(x=>!String(x.body||'').startsWith(NOTICE_PREFIX)).reverse()}
function loginView(reg=false){return `<div class="login"><div class="card"><h2>🐾 Portal do Revendedor</h2><p class="mu">${reg?'Crie sua conta. O administrador precisa aprovar.':'Entre com seu e-mail.'}</p>${reg?'<label>Nome</label><input id="name"><label>WhatsApp com DDD</label><input id="phone" type="tel">':''}<label>E-mail</label><input id="email" type="email"><label>Senha</label><input id="password" type="password" onkeydown="if(event.key==='Enter')${reg?'signup()':'login()'}"><button class="btn p" style="width:100%" onclick="${reg?'signup()':'login()'}">${reg?'Cadastrar':'Entrar'}</button><p style="text-align:center"><a href="#" onclick="$('#app').innerHTML=loginView(${!reg});return false">${reg?'Já tenho conta':'Quero ser revendedor'}</a></p></div></div>`}
async function login(){const{data,error}=await sb.auth.signInWithPassword({email:$('#email').value.trim().toLowerCase(),password:$('#password').value});if(error)return alert(error.message);await enter(data.user.id)}
async function signup(){const name=$('#name').value.trim(),phone=$('#phone').value.replace(/\D/g,''),email=$('#email').value.trim().toLowerCase(),password=$('#password').value;if(!name||phone.length<10||!email||password.length<6)return alert('Preencha todos os dados. A senha precisa ter pelo menos 6 caracteres.');const{error}=await sb.auth.signUp({email,password,options:{data:{name,phone}}});if(err(error))return;await sb.auth.signOut();alert('Cadastro enviado. Aguarde a aprovação do administrador.');go()}
async function logout(){await sb.auth.signOut();me=null;cart=[];go()}
function header(title){return `<header><span class="btn p" style="padding:5px 8px">🐾</span><b>${E(title)}</b><span class="mu">${E(me.name||'')}</span>${me.role==='rev'?'<button class="btn s" onclick="accountModal()">⚙️ Conta</button>':''}<button class="btn s" onclick="logout()">Sair</button></header>`}
function bigNotice(){if(!notice.active)return '';const maintenance=notice.maintenance;const type=maintenance?'maintenance':(['warning','error'].includes(notice.type)?notice.type:'info');return `<section class="site-notice ${type}" role="alert"><div class="notice-icon">${maintenance?'🛠️':type==='error'?'🚨':type==='warning'?'⚠️':'📢'}</div><span class="notice-label">${maintenance?'MANUTENÇÃO':type==='error'?'AVISO DE ERRO':type==='warning'?'ATENÇÃO':'AVISO IMPORTANTE'}</span><h1>${E(notice.title|| (maintenance?'Portal em manutenção':'Aviso importante'))}</h1><p>${E(notice.text|| (maintenance?'O portal está temporariamente em manutenção. Tente novamente mais tarde.':''))}</p></section>`}
function adminView(){const tabs=[['dash','📊 Painel'],['products','📦 Produtos'],['users','👥 Contas'],['orders','🧾 Pedidos'],['chat','💬 Chat'],['config','⚙️ Configurações']];let body=tab==='dash'?dashboard():tab==='products'?productsAdmin():tab==='users'?usersAdmin():tab==='orders'?ordersAdmin():tab==='chat'?chatAdmin():configAdmin();return header('Admin')+`<main class="wrap"><nav class="tabs">${tabs.map(([k,t])=>`<button class="tab ${tab===k?'on':''}" onclick="tab='${k}';go()">${t}</button>`).join('')}</nav>${body}</main>`}
function configAdmin(){const start=filterFrom||dateKey(new Date(new Date().getFullYear(),new Date().getMonth(),1)),end=filterTo||dateKey(new Date());return `<div class="grid">
<div class="card"><h2>📢 Aviso grande no portal</h2><p class="mu">O aviso aparece em destaque na página dos revendedores. Não será enviado nem exibido como mensagem de chat.</p><label>Tipo</label><select id="ntype"><option value="info" ${notice.type==='info'?'selected':''}>Aviso importante</option><option value="warning" ${notice.type==='warning'?'selected':''}>Atenção</option><option value="error" ${notice.type==='error'?'selected':''}>Erro ou falha</option></select><label>Título</label><input id="ntitle" maxlength="100" value="${E(notice.title||'')}"><label>Texto do aviso</label><textarea id="ntext" rows="5" maxlength="1000" placeholder="Escreva a mensagem que ficará em destaque no portal">${E(notice.text||'')}</textarea><label style="display:flex;align-items:center;gap:8px"><input id="nmaintenance" type="checkbox" ${notice.maintenance?'checked':''} style="width:18px;margin:0">Ativar manutenção e bloquear pedidos</label><div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:14px"><button class="btn p" onclick="publishNotice()">Publicar aviso</button><button class="btn d" onclick="removeNotice()">Remover aviso</button></div><p class="mu">${notice.active?'Há um aviso publicado.':'Nenhum aviso publicado.'}</p></div>
<div class="card"><h2>📦 Backup de vendas</h2><label>De</label><input id="from" type="date" value="${start}"><label>Até</label><input id="to" type="date" value="${end}"><label>Quantidade</label><select id="limit"><option value="all">Todas as vendas do período</option><option value="50">Últimas 50</option><option value="100">Últimas 100</option><option value="250">Últimas 250</option><option value="500">Últimas 500</option></select><button class="btn p" onclick="backup()">Baixar backup JSON</button></div>
<div class="card"><h2>📥 Importar backup</h2><p class="mu">Selecione um arquivo JSON de backup. Pedidos importados recebem novos números.</p><input id="backupFile" type="file" accept=".json,application/json"><button class="btn p" onclick="importBackup()">Importar vendas</button></div>
<div class="card"><h2>🗑️ Apagar vendas do período</h2><p class="mu">A exclusão é permanente. Confira as datas antes de confirmar.</p><button class="btn d" onclick="deletePeriod()">Apagar vendas selecionadas</button></div></div>`}
async function storeNotice(config){
 const targets=U.filter(u=>u.role==='rev');
 if(!targets.length)return alert('Não há contas de revendedor para atualizar.');
 for(let i=0;i<targets.length;i+=50){
  const batch=targets.slice(i,i+50).map(u=>{
   const tags=(META[u.id]?.tags||[]).filter(t=>!String(t).startsWith(NOTICE_PREFIX));
   if(config.active)tags.push(noticeTag(config));
   return{rev_id:u.id,tags,note:META[u.id]?.note||null};
  });
  const{error}=await sb.from('rev_meta').upsert(batch,{onConflict:'rev_id'});if(err(error))return false;
  batch.forEach(x=>META[x.rev_id]={tags:x.tags,note:x.note||''});
 }
 notice=config;return true;
}
async function publishNotice(){if(me.role!=='admin')return alert('Apenas o administrador pode publicar avisos.');const title=$('#ntitle').value.trim(),text=$('#ntext').value.trim(),maintenance=$('#nmaintenance').checked;if(!text&&!maintenance)return alert('Escreva o aviso ou ative a manutenção.');const config={active:true,maintenance,type:$('#ntype').value,title:title||(maintenance?'Portal em manutenção':'Aviso importante'),text:text||(maintenance?'O portal está temporariamente em manutenção. Tente novamente mais tarde.':'')};if(await storeNotice(config)){go();alert('Aviso publicado em destaque no portal dos revendedores.')}}
async function removeNotice(){if(me.role!=='admin')return alert('Apenas o administrador pode remover avisos.');if(await storeNotice({active:false,maintenance:false,type:'info',title:'',text:''})){go();alert('Aviso removido e manutenção desativada.')}}
function dateRange(){const a=$('#from')?.value||filterFrom||dateKey(new Date(new Date().getFullYear(),new Date().getMonth(),1)),b=$('#to')?.value||filterTo||dateKey(new Date());filterFrom=a;filterTo=b;return[a,b]}
function backup(){const[a,b]=dateRange();if(a>b)return alert('Confira as datas.');let list=O.filter(o=>dateKey(o.created_at)>=a&&dateKey(o.created_at)<=b).sort((x,y)=>new Date(x.created_at)-new Date(y.created_at));const limit=$('#limit').value;if(limit!=='all')list=list.slice(-Number(limit));if(!list.length)return alert('Não há vendas no período.');const pack={versao:1,periodo_ini:a,periodo_fim:b,qtd:list.length,criado_em:new Date().toISOString(),dados:list};download(`backup_vendas_${a}_a_${b}.json`,JSON.stringify(pack), 'application/json')}
function download(name,text,type){const u=URL.createObjectURL(new Blob([text],{type})),a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
async function importBackup(){const f=$('#backupFile')?.files?.[0];if(!f)return alert('Selecione um arquivo JSON.');let p;try{p=JSON.parse(await f.text())}catch(e){return alert('O arquivo não contém JSON válido.')}if(!Array.isArray(p.dados)||!p.dados.length)return alert('O backup não contém vendas.');if(!p.dados.every(o=>o&&o.who&&o.created_at&&Array.isArray(o.items)&&Number.isFinite(Number(o.total))))return alert('O backup contém dados inválidos.');if(!confirm(`Importar ${p.dados.length} venda(s)?`))return;for(let i=0;i<p.dados.length;i+=50){const rows=p.dados.slice(i,i+50).map(o=>({user_id:o.user_id||null,email:o.email||null,phone:o.phone||null,pickup:o.pickup||'qualquer',note:o.note||null,who:o.who,items:o.items,total:Number(o.total),status:o.status||'novo',created_at:o.created_at}));const{error}=await sb.from('orders').insert(rows);if(err(error))return}await refresh();alert('Backup importado.')}
async function deletePeriod(){const[a,b]=dateRange();if(a>b)return alert('Confira as datas.');const count=O.filter(o=>dateKey(o.created_at)>=a&&dateKey(o.created_at)<=b).length;if(!count)return alert('Não há vendas nesse período.');if(!confirm(`Apagar permanentemente ${count} venda(s), de ${a} até ${b}?`))return;const end=new Date(b+'T00:00:00');end.setDate(end.getDate()+1);const{error}=await sb.from('orders').delete().gte('created_at',new Date(a+'T00:00:00').toISOString()).lt('created_at',end.toISOString());if(err(error))return;await refresh();alert(`${count} venda(s) apagada(s).`)}
function dashboard(){const total=O.reduce((s,o)=>s+Number(o.total||0),0);return `<div class="grid"><div class="card"><b>${P.length}</b><br>Produtos</div><div class="card"><b>${U.filter(u=>u.role==='rev'&&u.status==='active').length}</b><br>Revendedores ativos</div><div class="card"><b>${O.length}</b><br>Pedidos</div><div class="card"><b>${R(total)}</b><br>Faturamento carregado</div></div><div class="card" style="margin-top:14px">${ordersList(true)}</div>`}
function productsAdmin(){return `<div class="card"><button class="btn p" onclick="productModal()">+ Novo produto</button><div class="grid" style="margin-top:12px">${P.map(p=>`<div class="card"><h3>${E(p.name)}</h3><span class="tag">${E(p.cat||'')}</span><p>${(p.vars||[]).map(v=>`${E(v.n)}: ${R(v.p)}`).join('<br>')}</p><button class="btn s" onclick="productModal(${p.id})">Editar</button> <button class="btn s d" onclick="deleteProduct(${p.id})">Excluir</button></div>`).join('')}</div></div>`}
function productModal(id){const p=P.find(x=>x.id==id)||{name:'',cat:'Camas',colors:'Único',vars:[],emo:'📦'},m=document.createElement('div');m.className='modal';m.innerHTML=`<div><h2>${id?'Editar':'Novo'} produto</h2><label>Nome</label><input id="pn" value="${E(p.name)}"><label>Categoria</label><input id="pc" value="${E(p.cat)}"><label>Cores, separadas por vírgula</label><input id="colors" value="${E(p.colors||'')}"><label>Preços, um por linha: Nome = preço</label><textarea id="vars" rows="5">${E((p.vars||[]).map(v=>v.n+' = '+v.p).join('\n'))}</textarea><button class="btn p" id="save">Salvar</button> <button class="btn" onclick="this.closest('.modal').remove()">Fechar</button></div>`;document.body.appendChild(m);m.querySelector('#save').onclick=async()=>{const vars=m.querySelector('#vars').value.split('\n').map(x=>x.split('=')).filter(x=>x.length>1&&!isNaN(parseFloat(x[1].replace(',','.')))).map(x=>({n:x[0].trim(),p:parseFloat(x[1].replace(',','.'))}));if(!m.querySelector('#pn').value.trim()||!vars.length)return alert('Informe nome e ao menos um preço.');const obj={name:m.querySelector('#pn').value.trim(),cat:m.querySelector('#pc').value.trim()||'Outros',colors:m.querySelector('#colors').value,vars,emo:p.emo||'📦',img:p.img||''};const r=id?await sb.from('products').update(obj).eq('id',id):await sb.from('products').insert(obj);if(err(r.error))return;m.remove();refresh()}}
async function deleteProduct(id){if(confirm('Excluir este produto?')){const{error}=await sb.from('products').delete().eq('id',id);if(err(error))return;refresh()}}
function usersAdmin(){return `<div class="card"><h2>Contas</h2>${U.map(u=>`<div class="row"><div><b>${E(u.name)}</b> <span class="tag">${E(u.role)}</span><br><span class="mu">${E(u.email)}</span></div><div><button class="btn s" onclick="editUser('${u.id}')">✏️ Dados</button> <button class="btn s" onclick="changeStatus('${u.id}','${u.status==='active'?'blocked':'active'}')">${u.status==='active'?'Bloquear':'Aprovar'}</button></div></div>`).join('')||'<p class="mu">Nenhuma conta encontrada.</p>'}</div>`}
function editUser(id){const u=U.find(x=>x.id===id);if(!u)return;const m=document.createElement('div');m.className='modal';m.innerHTML=`<div><h2>Editar conta</h2><label>Nome/apelido</label><input id="un" value="${E(u.name)}"><label>E-mail</label><input id="ue" type="email" value="${E(u.email)}"><label>WhatsApp</label><input id="up" value="${E(u.phone||'')}"><button class="btn p" id="save">Salvar</button> <button class="btn" onclick="this.closest('.modal').remove()">Fechar</button></div>`;document.body.appendChild(m);m.querySelector('#save').onclick=async()=>{const name=m.querySelector('#un').value.trim(),email=m.querySelector('#ue').value.trim().toLowerCase(),phone=m.querySelector('#up').value.replace(/\D/g,'');if(!name||!email)return alert('Informe nome e e-mail.');if(email!==u.email){const{error}=await sb.rpc('admin_update_user_email',{uid:id,novo_email:email});if(err(error))return}const{error}=await sb.from('profiles').update({name,email,phone:phone||null}).eq('id',id);if(err(error))return;m.remove();refresh()}}
async function changeStatus(id,status){const{error}=await sb.from('profiles').update({status}).eq('id',id);if(err(error))return;refresh()}
function ordersAdmin(){return `<div class="card"><label>Filtrar por e-mail</label><input value="${E(window.emailFilter||'')}" oninput="window.emailFilter=this.value;rerender(this)">${ordersList(true)}</div>`}
function ordersList(admin){const list=O.filter(o=>(admin||o.user_id===me.id)&&(!admin||!window.emailFilter||(o.email||'').toLowerCase().includes(window.emailFilter.toLowerCase())));return list.map(o=>`<div class="ord ${E(o.status)}"><div class="row"><div><b>${E(o.who)}</b> <span class="tag">${E(o.status)}</span><br><span class="mu">${E(o.email||'')} · #${o.id} · ${prettyDate(o.created_at)}</span></div><b class="price">${R(o.total)}</b></div><p>${(o.items||[]).map(i=>`${i.q}× ${E(i.sku||i.name)} ${E(i.v||'')} ${E(i.c||'')}`).join('<br>')}</p>${o.note?`<p class="mu">📝 ${E(o.note)}</p>`:''}${admin?`<select onchange="setStatus(${o.id},this.value)">${['novo','producao','concluido'].map(s=>`<option value="${s}" ${o.status===s?'selected':''}>${s}</option>`).join('')}</select> <button class="btn s d" onclick="deleteOrder(${o.id})">Excluir</button>`:''}</div>`).join('')||'<p class="mu">Nenhum pedido encontrado.</p>'}
async function setStatus(id,status){const{error}=await sb.rpc('set_order_status',{pedido_id:id,novo_status:status});if(err(error))return;refresh()}
async function deleteOrder(id){if(confirm('Excluir este pedido?')){const{error}=await sb.from('orders').delete().eq('id',id);if(err(error))return;refresh()}}
function sellerView(){if(notice.active&&notice.maintenance)return header('Portal em manutenção')+`<main class="wrap">${bigNotice()}<div class="card" style="text-align:center"><b>Os pedidos estão temporariamente pausados.</b><p class="mu">Aguarde a liberação do portal para fazer novos pedidos.</p></div></main>`;return header('Preços de Revenda')+`<main class="wrap">${bigNotice()}<div class="card"><h2>Olá, ${E(me.name)} 👋</h2><p class="mu">Escolha os produtos e envie seu pedido.</p></div><div class="grid" style="margin-top:14px">${P.map(p=>`<div class="card product"><h3>${E(p.name)}</h3><span class="tag">${E(p.cat||'')}</span><select id="v${p.id}">${(p.vars||[]).map((v,i)=>`<option value="${i}">${E(v.n)} · ${R(v.p)}</option>`).join('')}</select><select id="c${p.id}">${(p.colors||'Único').split(',').map(c=>`<option>${E(c.trim())}</option>`).join('')}</select><input id="q${p.id}" type="number" min="1" value="1"><button class="btn p" onclick="addToCart(${p.id})">Adicionar</button></div>`).join('')}</div><h2>Meus pedidos</h2>${ordersList(false)}${cart.length?`<button class="btn p" style="position:fixed;bottom:12px;left:12px;right:12px;width:calc(100% - 24px)" onclick="checkout()">🛒 Finalizar pedido · ${R(cart.reduce((a,i)=>a+i.p*i.q,0))}</button>`:''}</main>`}
function addToCart(id){const p=P.find(x=>x.id==id),v=p.vars[$('#v'+id).value],c=$('#c'+id).value,q=Math.max(1,parseInt($('#q'+id).value)||1),old=cart.find(x=>x.id==id&&x.v===v.n&&x.c===c);if(old)old.q+=q;else cart.push({id,name:p.name,v:v.n,c,p:Number(v.p),q,sku:v.skus?.[c]||''});go()}
async function checkout(){if(notice.active&&notice.maintenance)return alert('O portal está em manutenção. Pedidos pausados.');const phone=prompt('WhatsApp com DDD para contato:',me.phone||'')||'';if(phone.replace(/\D/g,'').length<10)return alert('Informe um WhatsApp válido.');const note=prompt('Observação opcional:')||'',total=cart.reduce((a,i)=>a+i.p*i.q,0),{error}=await sb.from('orders').insert({user_id:me.id,email:me.email,phone:phone.replace(/\D/g,''),pickup:'qualquer',note:note||null,who:me.name,items:cart,total});if(err(error))return;cart=[];await refresh();alert('Pedido enviado.')}
function workerView(){return header('Produção')+`<main class="wrap">${bigNotice()}${ordersList(true)}</main>`}
function ownerView(){return header('Dono')+`<main class="wrap">${bigNotice()}${ordersList(true)}</main>`}
function chatAdmin(){if(chatUser)return `<div class="card"><button class="btn s" onclick="chatUser=null;go()">← Conversas</button><h2>Chat com ${E(U.find(u=>u.id===chatUser)?.name||'revendedor')}</h2><div style="max-height:45vh;overflow:auto">${MSG.filter(m=>m.rev_id===chatUser).map(m=>`<p><b>${m.from_admin?'Admin':'Revendedor'}:</b> ${E(m.body||'')}</p>`).join('')||'<p class="mu">Sem mensagens.</p>'}</div><input id="msg"><button class="btn p" onclick="sendMessage()">Enviar</button></div>`;return `<div class="card"><h2>Conversas</h2>${U.filter(u=>u.role==='rev').map(u=>`<div class="row"><b>${E(u.name)} · ${E(u.email)}</b><button class="btn s" onclick="chatUser='${u.id}';go()">Abrir</button></div>`).join('')}</div>`}
async function sendMessage(){const body=$('#msg').value.trim();if(!body)return;const{error}=await sb.from('messages').insert({rev_id:chatUser,from_admin:true,body});if(err(error))return;await refresh();chatUser=chatUser;go()}
function accountModal(){const m=document.createElement('div');m.className='modal';m.innerHTML=`<div><h2>⚙️ Minha conta</h2><label>Nome/apelido</label><input id="an" value="${E(me.name)}"><label>E-mail</label><input id="ae" value="${E(me.email)}"><label>WhatsApp</label><input id="ap" value="${E(me.phone||'')}"><button class="btn p" id="save">Salvar</button><button class="btn" onclick="this.closest('.modal').remove()">Fechar</button></div>`;document.body.appendChild(m);m.querySelector('#save').onclick=async()=>{const name=m.querySelector('#an').value.trim(),email=m.querySelector('#ae').value.trim().toLowerCase(),phone=m.querySelector('#ap').value.replace(/\D/g,'');if(email!==me.email){const{error}=await sb.auth.updateUser({email});if(err(error))return}const{error}=await sb.from('profiles').update({name,email,phone:phone||null}).eq('id',me.id);if(err(error))return;me={...me,name,email,phone};m.remove();go();alert('Dados atualizados.')}}
function rerender(el){const id=el.id,pos=el.selectionStart;go();const x=document.getElementById(id);if(x){x.focus();x.setSelectionRange(pos,pos)}}
async function refresh(){await load();go()}
boot();
</script>
</body>
</html>
